[workspace]
resolver = "3"
members = [
    "server",
    "ui",
    "common/packets",
    "common/packets/macros",
    "common/packets/data",
    "common/auth",
    "common/domain",
    "common/action_macros"
]

[workspace.dependencies]
thiserror = "2.0.20"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "macros",
    "time",
    "fs",
] }
argon2 = { version = "0.5.3" }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1",  features = ["derive"]}
serde_json = { version = "1.0" }
slint = { version = "1.17.1" }
slint-build = "1.8"
reqwest = { version = "0.13", features = ["json"] }
